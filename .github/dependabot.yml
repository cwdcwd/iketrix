version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all non-breaking updates; majors still arrive individually
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (native Go compiler) is adopted deliberately, not via Dependabot
      - dependency-name: "typescript"
        versions: [">=7"]
      # @types/node tracks the runtime's Node major, bump it alongside the runtime
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
